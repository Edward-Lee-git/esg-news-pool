name: Collect

on:
  schedule:
    - cron: "0 23 * * 0-4"     # UTC 23:00 = KST 익일 08:00 (월~금)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect
        env:
          NAVER_API_KEY_ID: ${{ secrets.NAVER_API_KEY_ID }}
          NAVER_API_KEY: ${{ secrets.NAVER_API_KEY }}
          QUERIES_JSON: ${{ secrets.QUERIES_JSON }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/collect.py

      - name: Commit
        run: |
          git config user.name  "collector"
          git config user.email "collector@users.noreply.github.com"
          git add pool
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "pool: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi
