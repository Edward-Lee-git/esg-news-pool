<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>삼성물산 ESG 모니터링</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
__REPORT_STYLES__
<style>
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--page);z-index:21}
.app-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--page);border-bottom:1px solid var(--rule)}
.app-in{max-width:1040px;margin:0 auto;padding:12px 32px 0}
.app-title{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.app-title b{font-size:15px;line-height:22px;font-weight:700;color:var(--ink)}
.app-title span{font-size:12px;line-height:18px;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{font:inherit;font-size:14px;line-height:20px;padding:9px 14px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab:focus-visible,.go:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:7px;vertical-align:middle;background:var(--e-dot)}
.tab .dot.stale{background:var(--a-dot)}
.tab.sep{margin-left:10px;position:relative}
.tab.sep::before{content:"";position:absolute;left:-6px;top:12px;bottom:12px;width:1px;background:var(--rule)}
#app > .wrap{padding-top:24px}
.ov-head{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding-top:4px}
.ov-head h2{margin:0 0 4px}
.badge{display:inline-block;font-size:12px;line-height:18px;padding:1px 9px;border-radius:999px;border:1px solid var(--rule);color:var(--muted);font-variant-numeric:tabular-nums}
.badge.ok{background:var(--e-strip);color:var(--e-title);border-color:var(--e-dot)}
.badge.stale{background:var(--a-strip);color:var(--a-title);border-color:var(--a-dot)}
.go{margin-left:auto;display:inline-block;font:inherit;font-size:13px;line-height:20px;padding:4px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--accent);cursor:pointer;text-decoration:none}
.go:hover{border-color:var(--accent)}
.ov-pills{margin:6px 0 10px}
.ov-foot{margin:2px 0 10px;font-size:12px;line-height:18px;color:var(--muted);font-variant-numeric:tabular-nums}
/* 방법론 */
.mt{margin-bottom:16px}
.mt h2{margin:0 0 8px}
.mnote{font-size:12.5px;line-height:19px;color:var(--muted)}
.mlist{margin:6px 0 0;padding:0 0 0 20px;font-size:14px;line-height:23px;color:var(--text);list-style:disc}
/* 리포트 CSS의 '.card li'는 번호 목록용 가로 배치(flex)라서, 일반 글머리 목록에서는 되돌린다 */
.card .mlist li{display:list-item;list-style:disc;padding:0;border-top:0;margin:6px 0}
.mlist code{font-size:12.5px;padding:0 5px;border-radius:4px;background:var(--chip-bg);color:var(--chip-fg)}
.mscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mtable{width:100%;border-collapse:collapse;font-size:13.5px;line-height:21px;min-width:760px}
.mtable th,.mtable td{padding:9px 12px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top;color:var(--text)}
.mtable thead th{font-weight:600;color:var(--muted);white-space:nowrap;background:var(--strip,var(--page))}
.mtable tbody th{font-weight:600;color:var(--ink);white-space:nowrap}
.mtable td b{color:var(--ink)}
/* 검색어 */
.qbar{display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center;margin:4px 0 14px}
.qsearch{font:inherit;font-size:14px;line-height:20px;padding:7px 12px;min-width:240px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink)}
/* qsub·qchips는 아래에 정의 */
.qsub{padding:9px 20px 4px;font-size:12.5px;line-height:19px;font-weight:600;color:var(--muted);background:var(--page);border-top:1px solid var(--rule)}
.qchips{display:flex;flex-wrap:wrap;gap:6px 8px;padding:10px 20px 14px}
.qchips .chip.q{font-size:13px;line-height:22px;padding:0 9px;color:var(--ink);background:var(--chip-bg)}
.qchips .chip.q small.ov{margin-left:6px;font-size:11px;color:var(--muted)}
@media (max-width:640px){
  .app-in{padding:10px 16px 0}.go{margin-left:0}
  .qsub{padding:9px 14px 4px}.qchips{padding:10px 14px 14px}
}
</style>
</head>
<body>
<header class="app-top">
  <div class="app-in">
    <div class="app-title"><b>삼성물산 ESG 모니터링</b><span id="app-sub"></span></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="화면 선택"></nav>
  </div>
</header>
<div id="app" role="tabpanel"></div>
<noscript><div class="wrap"><p>이 화면은 스크립트가 켜져 있어야 보입니다.</p></div></noscript>

<template id="tpl-method">
<section class="card mt">
  <div class="note">
    <h2>하루 흐름 (월~금)</h2>
    <div class="mscroll"><table class="mtable"><thead><tr><th>순서</th><th>하는 일</th></tr></thead><tbody>
      <tr><th>1</th><td>기사 수집 — 검색어로 기사를 모아 <b>부정기사·규제동향·일반동향 목록 3개를 한 번에</b> 저장합니다</td></tr>
      <tr><th>2</th><td>부정기사 리포트 작성</td></tr>
      <tr><th>3</th><td>규제동향 리포트 작성</td></tr>
      <tr><th>4</th><td>일반동향 리포트 작성</td></tr>
    </tbody></table></div>
    <p class="mnote">주말·공휴일에는 수집도 리포트도 없어서, 월요일 리포트는 금요일 낮부터 월요일 새벽까지의 기사를 담습니다.</p>
  </div>
</section>

<section class="card mt">
  <div class="note">
    <h2>공통 규칙 — 기사 수집</h2>
    <ul class="mlist">
      <li><b>소스 4가지</b>: ① 네이버 뉴스 검색(국내) ② 구글 RSS(해외 기사) ③ ESG·노동 전문지 직접 수집(임팩트온·ESG경제·매일노동뉴스 RSS, 각 최근 50건을 필터 없이 전부 후보로) ④ 주요 14개 매체 훑기(각 최근 약 100건, 검색어와 무관하게 목록에 자리가 남을 때만)</li>
      <li><b>기간</b>: 직전 영업일 00:00부터 수집 시각까지(월요일·공휴일 다음 날은 더 길어짐). 전날 정기 수집본에 이미 담긴 기사는 제외</li>
      <li><b>확정</b>: 검색어마다 네이버가 최신 300건(기간 시작까지 내려가는 검색은 최대 1,000건)을 돌려주고, 띄어 쓴 낱말이 <b>모두</b> 있어야 확정합니다. 검색어 앞에 <code>^</code>가 붙으면 첫 낱말이 <b>제목에</b> 있어야 합니다</li>
      <li><b>노이즈 제거</b>: 확정되지 않은 기사는 버립니다. 다만 제목에 제재·사고·논란 같은 위험어가 있으면 <b><code>?</code> 기사</b>로 남깁니다(시황·부고·인사 기사는 제외). <code>?</code> 기사는 <b>검색어가 제목·요약에서는 확인되지 않았지만, 본문 깊숙이 검색어가 있을 수 있는 기사</b>입니다.</li>
      <li><b>상한과 순서</b>: 목록이 상한을 넘으면 ①전문지·해외·제목에 검색어 낱말이 있는 기사 → ②요약에만 있는 기사 → ③<code>?</code> 기사 → ④매체 훑기 순으로 남기고, 같은 단계에서는 날짜별로 골고루 남깁니다. 한 검색어가 독차지하지 못하게 검색어당 최신 100줄까지만 우선합니다</li>
    </ul>
  </div>
</section>

<section class="card mt">
  <div class="note">
    <h2>공통 규칙 — 리포트 작성</h2>
    <ul class="mlist">
      <li>루틴(Claude)이 목록의 <b>제목·매체·게재일·태그만</b> 보고 판단합니다. 뉴스 사이트가 차단되어 본문은 읽지 않으며, 요약은 제목에서 알 수 있는 사실만 씁니다</li>
      <li>제목만으로 불확실한 기사는 버리지 않고 <b>확인 필요</b>에 올려 사용자가 직접 확인하게 합니다</li>
      <li>링크는 목록의 원문 주소를 그대로 쓰고, 구글 경유 기사는 구글 뉴스 중계 링크를 씁니다</li>
      <li>같은 이슈에 기사가 여러 건이면 대표 1건만 싣습니다(통신사 우선)</li>
    </ul>
  </div>
</section>

<section class="card mt">
  <div class="note">
    <h2>탭별 차이</h2>
    <div class="mscroll"><table class="mtable"><thead><tr><th></th><th>부정기사</th><th>규제동향</th><th>일반동향</th></tr></thead><tbody>
      <tr><th>무엇을 찾나</th><td>대상 8개 회사의 부정적 이슈(소송·제재·사고·논란, 정부기관의 부정적 결정 포함)</td><td>정부·국회·국제기구의 ESG 규제·정책 발표</td><td>기업·업계의 ESG 동향과 규제에 대한 반응(정책 발표 자체는 제외)</td></tr>
      <tr><th>검색어</th><td><b data-cnt="neg">59</b>개 — 회사명·계열사·약어</td><td><b data-cnt="reg">61</b>개 — 부처·법안·공시기준·EU/미국 규제</td><td><b data-cnt="gen">53</b>개 — E·S·G 주제어·평가기관</td></tr>
      <tr><th>해외 소스</th><td>구글 RSS — 영어·인도네시아어·루마니아어</td><td>구글 RSS — 영어(영국판 위주, 미국 법 주제는 미국판)</td><td>구글 RSS — 영어(영국판)</td></tr>
      <tr><th>전문지 직접 수집·매체 훑기</th><td>없음</td><td>있음</td><td>있음</td></tr>
      <tr><th>확정 규칙</th><td><b>제목</b>에 검색어가 있어야 함(없어도 제목에 위험어가 있으면 <code>?</code> 기사로 남김)</td><td>제목 <b>또는 요약</b></td><td>제목 <b>또는 요약</b></td></tr>
      <tr><th>본문 확인</th><td>있음 — 제목에 회사명이 없고 위험 신호가 있는 기사(하루 약 25~35건)의 본문을 열어 검색어 유무 확인</td><td>없음</td><td>없음</td></tr>
      <tr><th>목록 상한</th><td>900줄</td><td>1,200줄</td><td>1,500줄</td></tr>
      <tr><th>리포트 구성</th><td>대상 8개 항목 + 확인 필요</td><td>환경·사회·지배구조·공통·글로벌 + 확인 필요</td><td>환경·사회·지배구조 + 확인 필요</td></tr>
      <tr><th>선별 방법</th><td>태그로 항목을 나누고 <b>제목 내용으로 부정 여부를 직접 판단</b>합니다. 회사명이 없어도 정부 제재·건설 사고·급식·바이오·팜오일 이슈는 후보로 올립니다</td><td>부처별 영역을 배경으로 제목을 하나씩 훑고, 보도자료·간담회·입법예고·토론회·국회·국무회의·전문매체 등 <b>발표 채널별로 한 번 더</b> 확인합니다</td><td>분야를 판단해 선별합니다. 개별 기업의 홍보성 기사(기부·MOU·보고서 발간·등급 취득)는 제외하고 삼성물산 사업영역 관련을 우선합니다</td></tr>
    </tbody></table></div>
  </div>
</section>

</template>

<script>
(function () {
  'use strict';
  var CATS = ['e', 's', 'g', 'n', 'p', 'a'];
  var warns = [];
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null && text !== '') e.textContent = String(text);
    return e;
  }
  function put(parent) {
    for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]);
    return parent;
  }
  function safeUrl(u) {
    if (u === undefined || u === null || u === '') return null;
    try {
      var s = String(u).trim(), p = new URL(s);
      if (p.protocol === 'http:' || p.protocol === 'https:') return s;
    } catch (e) {}
    warns.push('링크 형식 오류(링크 없음으로 표시함): ' + u);
    return null;
  }
  function chip(c) {
    var k = c.kind || 'sub';
    if (['sub', 'biz', 'alert'].indexOf(k) < 0) { warns.push('chip kind 오류(sub로 표시함): ' + k); k = 'sub'; }
    return el('span', 'chip' + (k === 'sub' ? '' : ' ' + k), c.text);
  }
  function row(r, withMark, markLabel) {
    var url = safeUrl(r.url), tr = el('div', 'tr');
    if (withMark) {
      var m = el('div', 'c-mark');
      if (r.mark) { var i = el('i', 'mk'); i.title = markLabel; m.appendChild(i); }
      tr.appendChild(m);
    }
    var main = el('div', 'c-main'), t;
    if (url) { t = el('a', 'title', r.title); t.href = url; t.target = '_blank'; t.rel = 'noopener noreferrer'; }
    else { t = el('span', 'title nolink', r.title); }
    put(main, t, r.summary ? el('div', 'sum', r.summary) : null);
    var tags = el('div', 'c-tags');
    (r.tags || []).forEach(function (c) { tags.appendChild(chip(c)); });
    if (r.needs_check) tags.appendChild(el('span', 'tag-dash check', '확인 필요'));
    if (!url) tags.appendChild(el('span', 'tag-dash nolink', '링크 없음'));
    return put(tr, main, el('div', 'c-src', r.source), el('div', 'c-date', r.date), tags);
  }
  function group(g, markLabel) {
    var cat = g.cat || 'n';
    if (CATS.indexOf(cat) < 0) { warns.push('cat 오류(n으로 표시함): ' + cat); cat = 'n'; }
    var rows = (g.rows || []).slice(), cols = g.cols || 'plain';
    if (cols !== 'mark' && cols !== 'plain') { warns.push('cols 오류(plain으로 표시함): ' + cols); cols = 'plain'; }
    if (cols === 'mark') {
      rows = rows.filter(function (r) { return r.mark; }).concat(rows.filter(function (r) { return !r.mark; }));
    }
    var nm = rows.filter(function (r) { return r.mark; }).length;
    var count = g.count || (rows.length ? rows.length + '건' + (cols === 'mark' ? ' · 사업 관련 ' + nm + '건' : '') : '');
    if (g.count_note) count = (count ? count + ' · ' : '') + g.count_note;
    var d = el('details', 'group cat-' + cat);
    if (g.open !== false) d.open = true;
    var gl = el('span', 'gl');
    put(gl, el('span', 'gdot'), g.num ? el('span', 'gnum', g.num) : null, el('h2', 'gtitle', g.title));
    (g.head_chips || []).forEach(function (c) { gl.appendChild(chip(c)); });
    gl.appendChild(el('span', 'gcount', count));
    var sm = el('summary', 'gh'); sm.appendChild(gl); d.appendChild(sm);
    if (rows.length) {
      var th = el('div', 'th');
      if (cols === 'mark') th.appendChild(el('div', 'c-mark', '주요'));
      put(th, el('div', null, '제목 · 요약'), el('div', null, '매체'), el('div', null, '게재일'), el('div', null, '분류'));
      var inn = el('div', 'tbl-in cols-' + cols); inn.appendChild(th);
      rows.forEach(function (r) { inn.appendChild(row(r, cols === 'mark', markLabel)); });
      d.appendChild(put(el('div', 'tbl-scroll'), inn));
    } else if (g.note) {
      d.appendChild(el('div', 'note', g.note));
    }
    if (g.more && rows.length) {
      var mo = el('details', 'more'); mo.appendChild(el('summary', 'more-h', g.more.label)); mo.appendChild(el('p', null, g.more.text));
      d.appendChild(mo);
    } else if (g.more) {
      d.appendChild(el('div', 'note', g.more.text));
    }
    return d;
  }
  function nolinkCount(data) {
    var n = 0;
    (data.groups || []).forEach(function (g) { (g.rows || []).forEach(function (r) { if (!safeUrl(r.url)) n++; }); });
    return n;
  }
  function pill(p, data) {
    var value = p.value;
    if (p.auto === 'nolink') value = nolinkCount(data) + '건';
    var cat = p.cat, s = el('span', cat ? 'pill cat-' + cat : 'pill');
    if (cat) s.appendChild(el('span', 'pdot'));
    s.appendChild(document.createTextNode(p.label === undefined || p.label === null ? '' : String(p.label)));
    s.appendChild(el('strong', null, value));
    return s;
  }
  function issuesList(data) {
    var ol = el('ol');
    (data.issues || []).forEach(function (x, i) {
      var li = el('li'), t = el('div', 't');
      t.appendChild(el('strong', null, x.title));
      if (x.body) { t.appendChild(document.createTextNode(' ')); t.appendChild(el('span', null, '— ' + x.body)); }
      put(li, el('span', 'n', i + 1), t); ol.appendChild(li);
    });
    return ol;
  }
  /* 리포트 탭: 큰 제목·핵심 이슈 없이 검색기간 줄 → 알약 → 분류별 기사 순서 */
  function renderReport(data) {
    warns = [];
    var markLabel = data.mark_label || '사업 관련';
    var wrap = el('div', 'wrap');
    wrap.appendChild(el('div', 'meta', data.meta));
    var pills = el('div', 'pills');
    (data.pills || []).forEach(function (p) { pills.appendChild(pill(p, data)); });
    wrap.appendChild(pills);
    if (data.legend) { var lg = el('div', 'legend'); put(lg, el('span', 'ldot')); lg.appendChild(document.createTextNode(data.legend)); wrap.appendChild(lg); }
    (data.groups || []).forEach(function (g) { wrap.appendChild(group(g, markLabel)); });
    var f = data.footer || {};
    wrap.appendChild(put(el('footer', 'foot'), el('div', null, f.limit), el('div', 'verify', f.verify)));
    if (warns.length) {
      var w = el('div', 'warn'); w.appendChild(el('b', null, '자료 점검: '));
      w.appendChild(document.createTextNode(warns.join(' / ')));
      wrap.insertBefore(w, pills);
    }
    return wrap;
  }

  function readJSON(id) {
    try { return JSON.parse(document.getElementById(id).textContent); } catch (e) { return null; }
  }
  var META = readJSON('app-meta') || {}, REP = META.reports || {};
  var DATA = { neg: readJSON('data-neg'), reg: readJSON('data-reg'), gen: readJSON('data-gen') };
  var QRY = readJSON('data-qry');
  var TABS = [['ov', '종합'], ['neg', '부정기사'], ['reg', '규제동향'], ['gen', '일반동향'], ['met', '방법론'], ['qry', '검색어']];
  var LABEL = { neg: '부정기사', reg: '규제동향', gen: '일반동향' };

  function statusText(k) {
    var m = REP[k] || {};
    if (m.status === 'fresh') return ['ok', '오늘 갱신 ' + (m.run_time || '')];
    if (m.status === 'stale') return ['stale', '미갱신 · 마지막 ' + (m.run_date || '?')];
    if (m.status === 'missing') return ['stale', '자료 없음'];
    return ['', '상태 확인 불가'];
  }
  function renderOverview() {
    var wrap = el('div', 'wrap');
    ['neg', 'reg', 'gen'].forEach(function (k) {
      var d = DATA[k], st = statusText(k), m = REP[k] || {};
      var sec = el('section', 'card ov');
      var head = el('div', 'ov-head');
      head.appendChild(el('h2', null, (d && d.title) || LABEL[k]));
      head.appendChild(el('span', 'badge ' + st[0], st[1]));
      var go = el('button', 'go', '전체 보기 →'); go.type = 'button';
      go.addEventListener('click', function () { show(k, true); });
      head.appendChild(go); sec.appendChild(head);
      if (!d) { sec.appendChild(el('div', 'note', '이 리포트의 자료를 읽지 못했습니다. 개별 리포트 페이지를 확인하세요.')); wrap.appendChild(sec); return; }
      warns = [];
      var pills = el('div', 'pills ov-pills');
      (d.pills || []).forEach(function (p) { pills.appendChild(pill(p, d)); });
      sec.appendChild(pills);
      sec.appendChild(issuesList(d));
      if (m.run_date) sec.appendChild(el('div', 'ov-foot', '작성 ' + m.run_date + ' ' + (m.run_time || '') + (m.collected ? ' · 수집 ' + m.collected : '')));
      wrap.appendChild(sec);
    });
    return wrap;
  }

  /* 방법론: 틀 안의 정적 설명. 검색어 개수만 검색어 자료에서 읽어 채운다 */
  function renderMethod() {
    var wrap = el('div', 'wrap');
    var tpl = document.getElementById('tpl-method');
    wrap.appendChild(tpl.content.cloneNode(true));
    if (QRY && QRY.sets) {
      var n = { reg: 0, gen: 0 };
      QRY.sets.forEach(function (s) { if (s.key === 'b') n.reg = s.rows.length; if (s.key === 'c') n.gen = s.rows.length; });
      n.neg = (QRY.seta || []).length;
      Array.prototype.forEach.call(wrap.querySelectorAll('[data-cnt]'), function (b) {
        var v = n[b.getAttribute('data-cnt')]; if (v) b.textContent = String(v);
      });
    }
    return wrap;
  }

  /* 검색어: 읽기 전용 참고 목록(칩). 편집은 원래 검색어 정리 페이지에서 한다 */
  var KIND_NAME = { '네이버 기본': '네이버 · 회사명·계열사', '네이버 추가': '네이버 · 약어', '해외RSS(en)': '구글 RSS · 영어', '해외RSS(id)': '구글 RSS · 인도네시아어', '해외RSS(ro)': '구글 RSS · 루마니아어' };
  var SECS = { b: ['규제동향', 'cat-s'], c: ['일반동향', 'cat-p'] };
  var REC_NAME = { '해외 영국': '구글 RSS 영국판', '해외 미국': '구글 RSS 미국판' };
  var qstate = { q: '' };
  function renderQueries() {
    var wrap = el('div', 'wrap');
    var card = el('section', 'card mt'), inner = el('div', 'note');
    var head = el('div', 'ov-head');
    head.appendChild(el('h2', null, '현재 쓰고 있는 검색어'));
    var edit = el('a', 'go', '검색어 정리 페이지 열기 →'); edit.href = (QRY && QRY.edit_url) || '#'; edit.target = '_blank'; edit.rel = 'noopener noreferrer';
    head.appendChild(edit); inner.appendChild(head);
    if (!QRY || !QRY.sets) {
      inner.appendChild(el('p', 'mnote', '검색어 자료를 읽지 못했습니다. 위 버튼으로 검색어 정리 페이지를 열어 확인하세요.'));
      card.appendChild(inner); wrap.appendChild(card); return wrap;
    }
    var nb = QRY.sets[0].rows.length, nc = QRY.sets[1].rows.length, na = (QRY.seta || []).length;
    inner.appendChild(el('p', 'mnote', '규제동향 ' + nb + '개 · 일반동향 ' + nc + '개 · 부정기사 ' + na + '개 — 참고용 목록입니다. ' + (QRY.basis || '').replace(/[.。]?\s*$/, '') + '. 앞에 ^가 붙은 검색어는 첫 낱말이 제목에 있어야 걸립니다. 바꾸려면 검색어 정리 페이지에서 표시하세요.'));
    var bar = el('div', 'qbar');
    var si = el('input', 'qsearch'); si.type = 'search'; si.placeholder = '검색어·분류 찾기'; si.setAttribute('aria-label', '검색어 찾기');
    var cnt = el('span', 'mnote');
    put(bar, si, cnt); inner.appendChild(bar); card.appendChild(inner); wrap.appendChild(card);
    var list = el('div'); wrap.appendChild(list);
    var order = QRY.cats || [], catLabel = QRY.catlabel || {};
    function section(title, cls, total, open) {
      var d = el('details', 'group ' + cls); d.open = open;
      var gl = el('span', 'gl');
      put(gl, el('span', 'gdot'), el('h2', 'gtitle', title), el('span', 'gcount', total + '개'));
      var sm = el('summary', 'gh'); sm.appendChild(gl); d.appendChild(sm);
      return d;
    }
    function chipOf(r, overseasMark) {
      var c = el('span', 'chip q', r.q);
      c.title = r.tag + (r.rec ? ' · ' + (REC_NAME[r.rec] || r.rec) : '') + (r.sub ? ' · ' + r.sub : '');
      if (overseasMark && r.rec && r.rec.indexOf('해외') === 0) c.appendChild(el('small', 'ov', '영어'));
      return c;
    }
    function draw() {
      list.textContent = '';
      var q = qstate.q.toLowerCase(), shown = 0;
      QRY.sets.forEach(function (s) {
        var meta = SECS[s.key] || [s.title, 'cat-n'];
        var rows = s.rows.filter(function (r) { return !q || (r.q + ' ' + r.tag + ' ' + r.sub + ' ' + r.cat).toLowerCase().indexOf(q) >= 0; });
        if (!rows.length) return;
        shown += rows.length;
        var d = section(meta[0] + ' 검색어', meta[1], rows.length, true);
        order.forEach(function (cat) {
          var rs = rows.filter(function (r) { return r.cat === cat; }).sort(function (a, b) { return a.ord - b.ord; });
          if (!rs.length) return;
          d.appendChild(el('div', 'qsub', (catLabel[cat] || cat) + ' ' + rs.length + '개'));
          var cw = el('div', 'qchips'); rs.forEach(function (r) { cw.appendChild(chipOf(r, true)); }); d.appendChild(cw);
        });
        list.appendChild(d);
      });
      var arows = (QRY.seta || []).filter(function (r) { return !q || (r.q + ' ' + r.tag + ' ' + r.kind).toLowerCase().indexOf(q) >= 0; });
      if (arows.length) {
        shown += arows.length;
        var d2 = section('부정기사 검색어', 'cat-a', arows.length, !!q || true);
        var kinds = {}, korder = [];
        arows.forEach(function (r) { if (!kinds[r.kind]) { kinds[r.kind] = []; korder.push(r.kind); } kinds[r.kind].push(r); });
        korder.forEach(function (k) {
          d2.appendChild(el('div', 'qsub', (KIND_NAME[k] || k) + ' ' + kinds[k].length + '개'));
          var cw = el('div', 'qchips'); kinds[k].forEach(function (r) { cw.appendChild(chipOf(r, false)); }); d2.appendChild(cw);
        });
        list.appendChild(d2);
      }
      cnt.textContent = q ? shown + '개 일치' : '';
      if (!shown) list.appendChild(el('div', 'note', '조건에 맞는 검색어가 없습니다.'));
    }
    si.addEventListener('input', function () { qstate.q = si.value; draw(); });
    draw();
    return wrap;
  }

  var current = null;
  function buildTabs() {
    var nav = document.getElementById('tabs');
    TABS.forEach(function (t) {
      var b = el('button', 'tab' + (t[0] === 'met' ? ' sep' : ''), t[1]); b.type = 'button'; b.id = 'tab-' + t[0];
      b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', 'false');
      if (LABEL[t[0]]) {
        var s = statusText(t[0]); var dot = el('span', 'dot' + (s[0] === 'ok' ? '' : ' stale')); dot.title = s[1]; b.appendChild(dot);
      }
      b.addEventListener('click', function () { show(t[0], true); });
      b.addEventListener('keydown', function (ev) {
        var i = TABS.map(function (x) { return x[0]; }).indexOf(t[0]);
        if (ev.key === 'ArrowRight') { ev.preventDefault(); show(TABS[(i + 1) % TABS.length][0], true); document.getElementById('tab-' + current).focus(); }
        if (ev.key === 'ArrowLeft') { ev.preventDefault(); show(TABS[(i + TABS.length - 1) % TABS.length][0], true); document.getElementById('tab-' + current).focus(); }
      });
      nav.appendChild(b);
    });
  }
  function show(k, save) {
    if (!document.getElementById('tab-' + k)) k = 'ov';
    current = k;
    TABS.forEach(function (t) { document.getElementById('tab-' + t[0]).setAttribute('aria-selected', t[0] === k ? 'true' : 'false'); });
    var app = document.getElementById('app'); app.textContent = '';
    app.setAttribute('aria-labelledby', 'tab-' + k);
    try {
      if (k === 'ov') app.appendChild(renderOverview());
      else if (k === 'met') app.appendChild(renderMethod());
      else if (k === 'qry') app.appendChild(renderQueries());
      else if (DATA[k]) app.appendChild(renderReport(DATA[k]));
      else { var w = el('div', 'wrap'), m = el('div', 'warn'); m.appendChild(el('b', null, '자료를 읽지 못했습니다: ')); m.appendChild(document.createTextNode(LABEL[k] + ' 리포트의 자료가 없습니다.')); app.appendChild(put(w, m)); }
    } catch (e) {
      var w2 = el('div', 'wrap'), m2 = el('div', 'warn'); m2.appendChild(el('b', null, '화면을 그리지 못했습니다: ')); m2.appendChild(document.createTextNode(String(e && e.message || e)));
      app.appendChild(put(w2, m2));
    }
    window.scrollTo(0, 0);
    if (save) { try { localStorage.setItem('esg-app-tab', k); } catch (e) {} }
  }
  document.getElementById('app-sub').textContent = '갱신 ' + (META.built_at || '') + (META.collected ? ' · 수집 ' + META.collected : '');
  buildTabs();
  var start = 'ov';
  try { var h = (location.hash || '').replace('#', ''); if (h && document.getElementById('tab-' + h)) start = h; else { var sv = localStorage.getItem('esg-app-tab'); if (sv && document.getElementById('tab-' + sv)) start = sv; } } catch (e) {}
  show(start, false);
})();
</script>
</body>
</html>
